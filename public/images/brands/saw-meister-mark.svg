<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Saw-Meister">
  <title>Saw-Meister</title>
  <!--
    A band with hook teeth on one edge, crossed by the weld seam.

    The seam is the point: it is the one thing the business guarantees, so the
    mark says what the brand promises rather than just drawing a saw. Three
    teeth rather than five — at 24px in a header, five teeth turn to mush.
  -->
  <defs>
    <clipPath id="sm-band">
      <path d="M5 38 L19 50 L22 38 L23 38 L37 50 L40 38 L41 38 L55 50 L58 38 L59 38 L59 14 L5 14 Z"/>
    </clipPath>
  </defs>
  <path
    d="M5 38 L19 50 L22 38 L23 38 L37 50 L40 38 L41 38 L55 50 L58 38 L59 38 L59 14 L5 14 Z"
    fill="#004FC6"/>
  <g clip-path="url(#sm-band)">
    <path d="M46 8 L36 56" stroke="#D97706" stroke-width="4.5" fill="none"/>
  </g>
</svg>
